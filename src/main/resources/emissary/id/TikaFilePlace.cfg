PLACE_NAME = "TikaFilePlace"
SERVICE_NAME = "TIKA_ID"
SERVICE_TYPE = "ID"
SERVICE_DESCRIPTION = "Identifies payload formats using Apache Tika MIME magic detection"

# Стоимость (Expense) = COST + QUALITY.
# Ставим небольшую стоимость (например, 20), чтобы Tika запускалась раньше более тяжёлых ID-сервисов
SERVICE_COST = 20
SERVICE_QUALITY = 90

# Реагируем на нераспознанные данные
SERVICE_PROXY = "UNKNOWN"

# Кастомные настройки нашего класса
USE_FILENAME_HINT = "true"
SET_FILETYPE = "true"

# Параметры payload (в порядке приоритета), из которых берётся имя файла для подсказки Tika
FILENAME_HINT_PARAM = "ATTACHMENT_FILENAME"
FILENAME_HINT_PARAM = "ARCHIVE_ENTRY_NAME"
FILENAME_HINT_PARAM = "Original-Filename"
FILENAME_HINT_PARAM = "FILE_NAME"

# Все формы, которые мы считаем окончательно распознанными (IdPlace снимет UNKNOWN со стека)
FINAL_ID = "*"

# Если Tika вернула просто поток байтов или пустой/неизвестный контейнер — игнорируем, пусть попробует другой ID-сервис
ID_IGNORE = "application/octet-stream"
ID_IGNORE = "application/x-tika-msoffice"
ID_IGNORE = "application/x-tika-ooxml"

# ==============================================================================
# Маппинг MIME-типов Tika во внутренние формы Emissary (ID_RENAME_<mime> = "<FORM>")
# ==============================================================================

# --- Почта и сообщения ---
ID_RENAME_message/rfc822 = "EML"
ID_RENAME_message/news = "EML"
ID_RENAME_application/mbox = "MBOX"
ID_RENAME_application/vnd.ms-outlook = "MSG"
ID_RENAME_application/vnd.ms-tnef = "TNEF"

# --- Архивы и сжатые данные ---
ID_RENAME_application/zip = "ZIP"
ID_RENAME_application/x-zip-compressed = "ZIP"
ID_RENAME_application/x-tar = "TAR"
ID_RENAME_application/x-gtar = "TAR"
ID_RENAME_application/gzip = "GZIP"
ID_RENAME_application/x-gzip = "GZIP"
ID_RENAME_application/x-bzip2 = "BZIP2"
ID_RENAME_application/x-xz = "XZ"
ID_RENAME_application/x-7z-compressed = "SEVENZ"
ID_RENAME_application/x-rar-compressed = "RAR"
ID_RENAME_application/vnd.rar = "RAR"
ID_RENAME_application/zstd = "ZSTD"

# --- Документы PDF, книги и постскрипт ---
ID_RENAME_application/pdf = "PDF"
ID_RENAME_application/postscript = "PS"
ID_RENAME_application/epub+zip = "EPUB"
ID_RENAME_image/vnd.djvu = "DJVU"

# --- Microsoft Office (OOXML и старый OLE2) ---
ID_RENAME_application/vnd.openxmlformats-officedocument.wordprocessingml.document = "DOCX"
ID_RENAME_application/vnd.ms-word.document.macroenabled.12 = "DOCX"
ID_RENAME_application/vnd.openxmlformats-officedocument.wordprocessingml.template = "DOCX"
ID_RENAME_application/vnd.ms-word.template.macroenabled.12 = "DOCX"
ID_RENAME_application/msword = "DOC"

ID_RENAME_application/vnd.openxmlformats-officedocument.spreadsheetml.sheet = "XLSX"
ID_RENAME_application/vnd.ms-excel.sheet.macroenabled.12 = "XLSX"
ID_RENAME_application/vnd.ms-excel.sheet.binary.macroenabled.12 = "XLSB"
ID_RENAME_application/vnd.openxmlformats-officedocument.spreadsheetml.template = "XLSX"
ID_RENAME_application/vnd.ms-excel = "XLS"

ID_RENAME_application/vnd.openxmlformats-officedocument.presentationml.presentation = "PPTX"
ID_RENAME_application/vnd.ms-powerpoint.presentation.macroenabled.12 = "PPTX"
ID_RENAME_application/vnd.openxmlformats-officedocument.presentationml.slideshow = "PPTX"
ID_RENAME_application/vnd.ms-powerpoint = "PPT"

ID_RENAME_application/vnd.visio = "VSD"
ID_RENAME_application/vnd.ms-visio.drawing = "VSDX"
ID_RENAME_application/vnd.ms-project = "MPP"
ID_RENAME_application/onenote = "ONENOTE"

# --- OpenDocument (LibreOffice / OpenOffice) и RTF ---
ID_RENAME_application/vnd.oasis.opendocument.text = "ODT"
ID_RENAME_application/vnd.oasis.opendocument.spreadsheet = "ODS"
ID_RENAME_application/vnd.oasis.opendocument.presentation = "ODP"
ID_RENAME_application/rtf = "RTF"
ID_RENAME_text/rtf = "RTF"

# --- Текстовые, табличные и размеченные данные ---
ID_RENAME_text/plain = "TXT"
ID_RENAME_text/markdown = "TXT"
ID_RENAME_text/x-log = "TXT"
ID_RENAME_text/csv = "CSV"
ID_RENAME_text/tab-separated-values = "TSV"
ID_RENAME_text/html = "HTML"
ID_RENAME_application/xhtml+xml = "HTML"
ID_RENAME_application/xml = "XML"
ID_RENAME_text/xml = "XML"
ID_RENAME_application/json = "JSON"
ID_RENAME_application/ld+json = "JSON"
ID_RENAME_application/x-ndjson = "JSON"
ID_RENAME_text/x-yaml = "YAML"
ID_RENAME_application/yaml = "YAML"
ID_RENAME_text/calendar = "ICS"
ID_RENAME_text/vcard = "VCARD"
ID_RENAME_text/x-vcard = "VCARD"

# --- Изображения (для OCR и анализа) ---
ID_RENAME_image/png = "PNG"
ID_RENAME_image/jpeg = "JPEG"
ID_RENAME_image/jpg = "JPEG"
ID_RENAME_image/tiff = "TIFF"
ID_RENAME_image/bmp = "BMP"
ID_RENAME_image/x-ms-bmp = "BMP"
