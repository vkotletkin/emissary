PLACE_NAME = "TikaFilePlace"
SERVICE_NAME = "TIKA_ID"
SERVICE_TYPE = "ID"
SERVICE_DESCRIPTION = "Identifies payload formats using Apache Tika MIME magic detection"

# Стоимость (Expense) = COST + QUALITY.
# Ставим небольшую стоимость (например, 20), чтобы Tika запускалась раньше более тяжёлых ID-сервисов
SERVICE_COST = 20
SERVICE_QUALITY = 90

# Реагируем на нераспознанные данные
SERVICE_PROXY = "UNKNOWN"

# Кастомные настройки нашего класса
USE_FILENAME_HINT = "true"
SET_FILETYPE = "true"

# Все формы, которые мы считаем окончательно распознанными (IdPlace снимет UNKNOWN со стека)
FINAL_ID = "*"

# Если Tika вернула просто поток байтов — игнорируем, пусть попробует другой ID-сервис
ID_IGNORE = "application/octet-stream"

# Маппинг MIME-типов Tika во внутренние формы Emissary (читается базовым классом IdPlace автоматически!)
ID_RENAME_application/zip = "ZIP"
ID_RENAME_application/x-tar = "TAR"
ID_RENAME_application/gzip = "GZIP"
ID_RENAME_application/x-7z-compressed = "SEVENZ"
ID_RENAME_application/pdf = "PDF"
ID_RENAME_message/rfc822 = "EML"
ID_RENAME_text/html = "HTML"
ID_RENAME_application/json = "JSON"
ID_RENAME_image/png = "PNG"
ID_RENAME_image/jpeg = "JPEG"