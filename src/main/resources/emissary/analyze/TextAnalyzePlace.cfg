PLACE_NAME = "TextAnalyzePlace"
SERVICE_NAME = "TEXT_ANALYZER"
SERVICE_TYPE = "ANALYZE"
SERVICE_DESCRIPTION = "Extracts emails, phone numbers, IPv4/IPv6 addresses, URLs, INN/SNILS, and named entities (persons/orgs) from TEXT payloads"

SERVICE_COST = 10
SERVICE_QUALITY = 90
SERVICE_PROXY = "TEXT"

# Настройки базового класса emissary.analyze.Analyzer:
# Сначала ищем чистый текст в AlternateView("TEXT"), иначе берём основной payload.data()
PREFERRED_VIEW = "TEXT"

# Какие категории данных извлекать
EXTRACT_EMAILS = "true"
EXTRACT_PHONES = "true"
EXTRACT_IP_ADDRESSES = "true"
EXTRACT_URLS = "true"

# Настройки Google libphonenumber для поиска телефонов в тексте:
# Регион по умолчанию для номеров без международного префикса '+' (например, 8 (999) 123-45-67 -> +79991234567)
DEFAULT_PHONE_REGION = "RU"
# Строгость проверки номеров (POSSIBLE, VALID, STRICT_GROUPING, EXACT_GROUPING)
PHONE_LENIENCY = "VALID"

# Лимит уникальных совпадений на каждую категорию в одном документе
MAX_MATCHES_PER_CATEGORY = 500
