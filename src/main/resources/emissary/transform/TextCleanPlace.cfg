PLACE_NAME = "TextCleanPlace"
SERVICE_NAME = "TEXT_CLEANER"
SERVICE_TYPE = "TRANSFORM"
SERVICE_DESCRIPTION = "Cleans raw TXT payloads (control chars, zero-width chars, excessive newlines/spaces) and outputs form TEXT"

SERVICE_COST = 20
SERVICE_QUALITY = 90
SERVICE_PROXY = "TXT"

# Максимальное число подряд идущих переводов строк (например, 2 = максимум один пустой абзац между блоками)
MAX_CONSECUTIVE_NEWLINES = 2

# Применять ли Unicode NFC нормализацию
NORMALIZE_UNICODE_NFC = "true"

# Схлопывать ли серии пробелов и табов в один пробел
COLLAPSE_SPACES = "true"

# Схлопывать ли длинные линии-разделители (--------, ========)
COLLAPSE_SEPARATOR_RUNS = "true"

# Обновлять ли основной payload (data) очищенным UTF-8 текстом
UPDATE_PRIMARY_DATA = "true"

# Имя AlternateView, куда дополнительно кладётся чистый текст (для наследников emissary.analyze.Analyzer)
ALTERNATE_VIEW_NAME = "TEXT"
