PLACE_NAME = "PdfPlace"
SERVICE_NAME = "PDF_PARSER"
SERVICE_TYPE = "TRANSFORM"
SERVICE_DESCRIPTION = "Extracts metadata, text (as child TXT), and embedded files from PDF documents using Apache PDFBox"

SERVICE_COST = 30
SERVICE_QUALITY = 90
SERVICE_PROXY = "PDF"

# Максимальное количество страниц для извлечения текста
MAX_PAGES = 2000

# Сортировать ли текстовые блоки по координатам на странице (полезно для многоколоночной вёрстки)
SORT_BY_POSITION = "false"

# Извлекать ли вложенные внутрь PDF файлы (EmbeddedFiles) как дочерние объекты
EXTRACT_EMBEDDED_FILES = "true"
