PLACE_NAME = "TikaTransformPlace"
SERVICE_NAME = "TIKA_TRANSFORM"
SERVICE_TYPE = "TRANSFORM"
SERVICE_DESCRIPTION = "Fallback transform place using Apache Tika AutoDetectParser to extract body text (as child TXT), metadata, and embedded attachments"

# Высокая стоимость, чтобы специализированные модули (SERVICE_COST = 20..30) всегда имели приоритет,
# а сюда попадали только те формы (включая UNKNOWN), для которых не нашлось своего обработчика
SERVICE_COST = 90
SERVICE_QUALITY = 20

SERVICE_PROXY = "*"

# Исключаем системные и уже очищенные текстовые формы, чтобы не возникало циклов
SERVICE_PROXY_DENY = "TXT"
SERVICE_PROXY_DENY = "TEXT"
SERVICE_PROXY_DENY = "EMPTY_SESSION"
SERVICE_PROXY_DENY = "ERROR"
SERVICE_PROXY_DENY = "DONE"

# Лимит символов при извлечении текста из тела документа
MAX_TEXT_CHARS = 10000000

# Извлекать ли вложенные файлы / архивные записи через Tika EmbeddedDocumentExtractor как дочерние объекты
EXTRACT_EMBEDDED_ATTACHMENTS = "true"
SKIP_IMAGE_ATTACHMENTS = "false"

# Лимиты защиты от архивных бомб при извлечении вложений
MAX_ATTACHMENTS = 500
MAX_TOTAL_ATTACHMENT_BYTES = 104857600

# Если AutoDetectParser не извлёк текст (например, для UNKNOWN / octet-stream),
# проверять, является ли тело читаемым текстом, и извлекать его через TXTParser как дочерний TXT
DETECT_TEXT_FALLBACK = "true"

# Сохранять ли метаданные Tika в параметры родительского объекта
EXTRACT_METADATA = "true"
MAX_METADATA_KEYS = 100
MAX_METADATA_VALUE_LENGTH = 2000

# Параметры payload (в порядке приоритета), из которых берётся имя файла для подсказки Tika
FILENAME_HINT_PARAM = "ATTACHMENT_FILENAME"
FILENAME_HINT_PARAM = "ARCHIVE_ENTRY_NAME"
FILENAME_HINT_PARAM = "Original-Filename"
FILENAME_HINT_PARAM = "FILE_NAME"
